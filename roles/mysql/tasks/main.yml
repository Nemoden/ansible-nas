---
- name: Start MySQL
  block:
    - name: Create mysql network
      community.docker.docker_network:
        name: mysql

    - name: Create Mysql Config Directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      with_items:
        - "{{ mysql_config_directory }}"

    - name: Add conf.d
      ansible.builtin.copy:
        src: files/conf.d
        dest: "{{ mysql_config_directory }}/"

    - name: Start MySQL container
      community.docker.docker_container:
        name: "{{ mysql_container_name }}"
        image: "{{ mysql_container_image_name }}:{{ mysql_container_image_version }}"
        pull: true
        volumes:
          - "{{ mysql_data_directory }}:/var/lib/mysql"
          - "{{ mysql_config_directory }}/conf.d:/etc/mysql/conf.d"
        ports:
          - "{{ mysql_port }}:{{ mysql_port }}"
        networks:
          - name: "mysql"
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        restart_policy: unless-stopped
        memory: "{{ mysql_memory }}"
      when: mysql_enabled is true

- name: Stop MySQL
  community.docker.docker_container:
    name: "{{ mysql_container_name }}"
    state: absent
  when: mysql_enabled is false
